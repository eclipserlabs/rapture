# V4 value-probe egress ACL.
# CONNECT-only, hostname allowlist. No IP allowlist, no CDN range, no wildcard.
http_port 3128

acl SSL_ports port 443
acl CONNECT method CONNECT

# Initial allowlist -- exact hostnames only, per the frozen authorization.
# *.opencode.ai is deliberately NOT used.
acl model_hosts dstdomain api.opencode.ai opencode.ai

http_access allow CONNECT model_hosts SSL_ports
http_access deny all

# Plain-HTTP proxying is denied by the rules above (no allow rule matches a
# non-CONNECT method), so every GET/POST through the proxy is logged and denied.

access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
cache deny all
forwarded_for delete
via off
httpd_suppress_version_string on

dns_v4_first on
shutdown_lifetime 1 seconds
